robot: "g1"
robot_scene: "scene.xml"

domain_id: 1
interface: "lo"
idl_type: -1

use_joystick: 0
joystick_type: "xbox"
joystick_device: "/dev/input/js0"
joystick_bits: 16

print_scene_information: 1

enable_elastic_band: 0

lidar:
  enabled: true
  site_name: lidar_site
  frame_id: lidar_frame
  topic: /lidar/points
  horizontal_samples: 180
  vertical_samples: 16
  vertical_min_deg: -15.0
  vertical_max_deg: 15.0
  range_min_m: 0.1
  range_max_m: 20.0
  rate_hz: 5.0
  exclude_mount_body: true